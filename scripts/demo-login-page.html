<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Demo-Login — KDBX Keychain Akzeptanztest</title>
  <style>
    body { font-family: Inter, Cantarell, sans-serif; background: #f6f5f4; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    form { background: #fff; border: 1px solid rgba(0 0 0 / 12%); border-radius: 12px; padding: 32px; width: 320px; }
    h1 { font-size: 18px; margin-top: 0; }
    label { display: block; font-size: 12px; color: #555; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #bbb; border-radius: 8px; font-size: 14px; }
    button { margin-top: 16px; width: 100%; padding: 10px; background: #3584e4; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .ok { color: #26a269; font-size: 13px; margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <!-- bewusst Heuristik-Trigger: klassische Namen, autocomplete-Attribute, React-artige controlled inputs -->
  <form id="login" onsubmit="return demo(event)">
    <h1>Demo-Dienst Login</h1>
    <label for="username">Benutzername</label>
    <input id="username" name="username" type="text" autocomplete="username" />
    <label for="password">Passwort</label>
    <input id="password" name="password" type="password" autocomplete="current-password" />
    <label for="otp">2FA-Code (optional)</label>
    <input id="otp" name="otp" type="text" autocomplete="one-time-code" inputmode="numeric" />
    <button type="submit">Anmelden</button>
    <div id="result" class="ok"></div>
  </form>
  <script>
    // React-/Angular-Simulation: Werte müssen per native Setter + input-Event landen,
    // sonst sieht das "Framework" sie nicht (Tusk-Problem #3).
    function value(obj, prop, val) {
      Object.getOwnPropertyDescriptor(obj, prop)?.set?.call(obj, val);
    }
    function demo(ev) {
      ev.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const o = document.getElementById('otp').value;
      const last = value; // referenzieren, damit kein Unused-Warning-Stil entsteht
      document.getElementById('result').textContent =
        `Empfangen: user=${u ? '✓' : '—'} pass=${p ? '✓' : '—'} otp=${o ? '✓' : '—'}`;
      return false;
    }
  </script>
</body>
</html>
