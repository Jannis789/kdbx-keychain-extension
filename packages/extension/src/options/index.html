<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../popup/style.css" />
    <title>KDBX Keychain — Einstellungen</title>
    <style>
      body { width: 620px; margin: 0 auto; padding: 24px 20px 60px; }
      main { gap: 14px; }
      .grid { display: grid; grid-template-columns: 200px 1fr; gap: 10px 14px; align-items: center; }
      .grid label { margin: 0; }
      .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .note { font-size: 11.5px; color: var(--fg-dim); margin: 4px 0 0; }
      .redirect { font-family: ui-monospace, monospace; font-size: 11px; user-select: all; }
      h3 { font-size: 12.5px; margin: 14px 0 6px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.4px; }
    </style>
  </head>
  <body>
    <header>
      <h1>⚙ KDBX Keychain — Einstellungen</h1>
    </header>
    <main id="view">
      <div class="card">
        <h2>Dropbox</h2>
        <div class="status-row">
          <span id="dropbox-status" class="chip dim-chip">prüfe…</span>
          <button id="btn-connect" class="btn primary small">Mit Dropbox verbinden (PKCE)</button>
          <button id="btn-disconnect" class="btn small danger">Trennen</button>
        </div>
        <p class="note">
          Redirect-URI (einmalig in der <a href="https://www.dropbox.com/developers/apps" target="_blank">Dropbox-App-Konsole</a> eintragen):
          <span id="redirect-uri" class="redirect"></span>
        </p>
        <h3>Alternativ: Refresh-Token importieren</h3>
        <div class="field">
          <textarea id="refresh-token" rows="2" placeholder="refresh_token (z. B. aus rclone.conf [dropbox] token=… JSON)"></textarea>
        </div>
        <button id="btn-token" class="btn small">Token übernehmen</button>
      </div>

      <div class="card">
        <h2>Tresor</h2>
        <div class="grid">
          <label for="set-autolock">Auto-Lock nach (Minuten, 0 = nie)</label>
          <input id="set-autolock" type="number" min="0" max="1440" step="1" />
          <label for="set-clipboard">Zwischenablage löschen nach (Sekunden, 0 = nie)</label>
          <input id="set-clipboard" type="number" min="0" max="600" step="1" />
          <label for="set-remotepath">KDBX-Pfad auf Dropbox</label>
          <input id="set-remotepath" type="text" placeholder="/kdbx-keychain/test.kdbx" />
        </div>
        <p class="note">Stay-open (ADR-004): Der Schlüssel liegt nur im RAM (storage.session) — nach Browser-Neustart einmal entsperren.</p>
        <div style="margin-top: 10px">
          <button id="btn-save" class="btn primary">Speichern</button>
        </div>
      </div>

      <div id="toast" class="toast" hidden></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
